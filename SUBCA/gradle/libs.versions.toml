[versions]
agp = "9.0.1"
googleServices = "4.5.0"
ksp = "2.2.10-2.0.2"

appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"

junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

firebaseBom = "34.18.0"
firebaseUiFirestore = "9.1.1"

cardview = "1.0.0"
circleimageview = "3.1.0"
volley = "1.2.1"

room = "2.8.4"
oneSignal = "5.9.9"
generativeai = "0.9.0"
googleAuth = "1.52.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-database = { module = "com.google.firebase:firebase-database" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

firebaseui-firestore = { module = "com.firebaseui:firebase-ui-firestore", version.ref = "firebaseUiFirestore" }

androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
circleimageview = { module = "de.hdodenhof:circleimageview", version.ref = "circleimageview" }
volley = { module = "com.android.volley:volley", version.ref = "volley" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

onesignal = { module = "com.onesignal:OneSignal", version.ref = "oneSignal" }

generativeai = { module = "com.google.ai.client.generativeai:generativeai", version.ref = "generativeai" }
google-auth = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }